name: Publish Package

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write
  packages: write
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - uses: pnpm/action-setup@v4
        with:
          version: 10.4.1

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build
        run: pnpm build

      - name: Configure registry for npm
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          registry-url: "https://registry.npmjs.org"

      # npm's Trusted Publishing (OIDC) needs npm >=11.5.1; the version
      # bundled with Node 22 setup-node is older, so upgrade it first.
      - name: Update npm
        run: npm install -g npm@latest

      - name: Publish to npm
        run: npm publish --access public

      # GitHub Packages requires the npm scope to match the repository
      # owner (@eviannaive), which differs from the npmjs.org package
      # name (@arisevan/react-secret-input). Rename only for this publish.
      - name: Configure registry for GitHub Packages
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          registry-url: "https://npm.pkg.github.com"
          scope: "@eviannaive"

      - name: Set package name for GitHub Packages
        run: npm pkg set name=@eviannaive/react-secret-input

      - name: Publish to GitHub Packages
        run: npm publish
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release create ${{ github.ref_name }} --title ${{ github.ref_name }} --generate-notes
